name: AI Code Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  ai-review:
    name: AI Review Only
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================
      # 1. Generate DIFF
      # =========================
      - name: Generate diff
        run: |
          git diff ${{ github.event.pull_request.base.sha }} \
                   ${{ github.event.pull_request.head.sha }} > pr.diff

      # =========================
      # 2. Call AI Backend (SAFE)
      # =========================
      - name: Call AI backend (safe request)
        run: |
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST "$API_URL/analyze" \
            -H "Content-Type: application/json" \
            -d "{\"diff\": \"$(cat pr.diff | sed 's/\"/\\\"/g')\"}")

          echo "$RESPONSE" > raw_response.txt
          cat raw_response.txt
        env:
          API_URL: ${{ secrets.AI_REVIEW_API_URL }}

      # =========================
      # 3. Extract JSON safely
      # =========================
      - name: Extract JSON safely
        run: |
          BODY=$(sed '/HTTP_STATUS:/d' raw_response.txt)
          STATUS=$(grep HTTP_STATUS raw_response.txt | cut -d: -f2)

          echo "$BODY" > result.json

          echo "HTTP STATUS: $STATUS"
          cat result.json

          # Stop if HTTP error
          if [ "$STATUS" -ne 200 ]; then
            echo "❌ API returned HTTP error"
            exit 1
          fi

          # Validate JSON
          if ! jq empty result.json 2>/dev/null; then
            echo "❌ Invalid JSON received from API"
            cat result.json
            exit 1
          fi

      # =========================
      # 4. Check BLOCKERS (SAFE)
      # =========================
      - name: Check blockers
        id: decision
        run: |
          BLOCKERS=$(jq '[.findings[]? | select(.severity=="BLOCKER")] | length' result.json)

          echo "BLOCKERS: $BLOCKERS"

          if [ "$BLOCKERS" -gt 0 ]; then
            echo "❌ BLOCKERS FOUND"
            exit 1
          else
            echo "✅ NO BLOCKERS"
          fi

      # =========================
      # 5. Comment PR safely
      # =========================
      - name: Comment PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let body = "## 🤖 AI Code Review\n";

            try {
              if (fs.existsSync("result.json")) {
                const raw = fs.readFileSync("result.json", "utf8");
                const data = JSON.parse(raw);

                body += "```json\n" + JSON.stringify(data, null, 2) + "\n```";
              } else {
                body += "\n⚠️ No result.json found";
              }
            } catch (e) {
              body += "\n❌ Error parsing AI response (invalid JSON)";
            }

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body
            });