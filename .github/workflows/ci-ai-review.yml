name: AI Code Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  ai-review:
    name: AI Review Only
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate diff
        run: |
          git diff ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} > pr.diff

      - name: Send to AI backend
        run: |
          RESPONSE=$(curl -s -X POST "$API_URL/analyze" \
            -H "Content-Type: application/json" \
            -d "{\"diff\": \"$(cat pr.diff | sed 's/\"/\\\"/g')\"}")

          echo "$RESPONSE" > result.json
        env:
          API_URL: ${{ secrets.AI_REVIEW_API_URL }}

      - name: Check blockers
        id: decision
        run: |
          BLOCKERS=$(jq '[.findings[] | select(.severity=="BLOCKER")] | length' result.json)

          if [ "$BLOCKERS" -gt 0 ]; then
            echo "❌ BLOCKERS DETECTED"
            exit 1
          else
            echo "✅ NO BLOCKERS"
          fi

      - name: Comment PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = "## 🤖 AI Review\n";

            if (fs.existsSync("result.json")) {
              const data = JSON.parse(fs.readFileSync("result.json"));
              body += "```json\n" + JSON.stringify(data, null, 2) + "\n```";
            }

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body
            });