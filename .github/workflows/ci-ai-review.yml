name: AI Code Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    name: AI Review Only
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate diff
        run: |
          git diff ${{ github.event.pull_request.base.sha }} \
                   ${{ github.event.pull_request.head.sha }} > pr.diff

      - name: Call AI backend
        run: |
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST "$API_URL/analyze" \
            -H "Content-Type: application/json" \
            -d "{\"diff\": \"$(cat pr.diff | sed 's/\"/\\\"/g')\"}")

          echo "$RESPONSE" > raw_response.txt
          cat raw_response.txt
        env:
          API_URL: ${{ secrets.AI_REVIEW_API_URL }}

      - name: Validate API response
        run: |
          BODY=$(sed '/HTTP_STATUS:/d' raw_response.txt)
          STATUS=$(grep HTTP_STATUS raw_response.txt | cut -d: -f2)

          echo "$BODY" > result.json

          echo "HTTP STATUS: $STATUS"
          cat result.json

          if [ "$STATUS" -ne 200 ]; then
            echo "API returned HTTP $STATUS"
            exit 1
          fi

          if ! jq empty result.json 2>/dev/null; then
            echo "Invalid JSON received"
            cat result.json
            exit 1
          fi

      - name: Check blockers
        run: |
          BLOCKERS=$(jq '[.findings[]? | select(.severity=="BLOCKER")] | length' result.json)

          echo "BLOCKERS FOUND: $BLOCKERS"

          if [ "$BLOCKERS" -gt 0 ]; then
            echo "BLOCKERS DETECTED"
            exit 1
          else
            echo "NO BLOCKERS"
          fi

      - name: Comment PR
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            let body = "## AI Code Review\n\n";

            try {
              if (fs.existsSync("result.json")) {
                const raw = fs.readFileSync("result.json", "utf8");
                const data = JSON.parse(raw);
                body += "```json\n" + JSON.stringify(data, null, 2) + "\n```";
              } else {
                body += "No result.json found";
              }
            } catch (e) {
              body += "Error parsing AI response";
            }

            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              body: body,
              event: "COMMENT"
            });
